[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campusecho"
version = "0.3.0"
description = "知识图谱多跳问答、混合搜索与校园任务采纳工作台"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "pgmpy==1.1.2", "matplotlib>=3.10,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "httpx>=0.28,<1"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
campusecho = "campusecho.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
campusecho = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

