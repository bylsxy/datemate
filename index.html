<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="theme-color" content="#fbf9f6"><meta name="description" content="约会策划"><title>约会策划 · DateMate</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css?v=4.1.1"><script type="module" src="./app.mjs?v=4.1.0"></script>
</head>
<body><div class="page-shell">
<header class="site-header"><a class="brand" href="./" aria-label="DateMate 首页"><span class="brand-mark" aria-hidden="true">d.</span><span>DateMate</span></a></header>
<section class="hero"><h1>约会策划</h1></section>
<div class="workspace"><aside class="sidebar"><details class="conditions" id="conditions"><summary>条件</summary><form id="conditions-form" class="form" autocomplete="off">
<fieldset class="slot-field"><legend>时段</legend><div class="choices slot-choices"><label class="choice slot-choice"><input name="slots" type="checkbox" value="morning"><span>上午<small>7:30–12:00</small></span></label><label class="choice slot-choice"><input name="slots" type="checkbox" value="afternoon" checked><span>下午<small>14:00–18:00</small></span></label><label class="choice slot-choice"><input name="slots" type="checkbox" value="evening"><span>晚上<small>19:00–23:00</small></span></label><label class="choice slot-choice"><input name="slots" type="checkbox" value="night"><span>夜晚<small>23:00–次日02:00</small></span></label></div></fieldset>
<p id="condition-error" class="condition-error" role="alert" hidden></p>
<fieldset><legend>忌口</legend><div class="choices"><label class="choice"><input name="diet" type="checkbox" value="raw">不吃生食</label><label class="choice"><input name="diet" type="checkbox" value="spicy">不吃辣</label><label class="choice"><input name="diet" type="checkbox" value="seafood">避开海鲜</label><label class="choice"><input name="diet" type="checkbox" value="caffeine">避开咖啡因</label></div></fieldset>
<details class="advanced"><summary>高级选项</summary>
<fieldset><legend>环境与安排</legend><div class="choices"><label class="choice"><input type="checkbox" id="quiet">安静</label><label class="choice"><input type="checkbox" id="crowd">人少</label><label class="choice"><input type="checkbox" id="indoor">室内</label><label class="choice"><input type="checkbox" id="rain">预计下雨</label><label class="choice"><input type="checkbox" id="quiet-hard">必须安静</label><label class="choice"><input type="checkbox" id="saving">节省一些</label></div></fieldset>
<fieldset><legend>状态</legend><div class="choices"><label class="choice"><input type="checkbox" id="tired-a">我方疲惫</label><label class="choice"><input type="checkbox" id="tired-b">对方疲惫</label></div></fieldset>
<fieldset><legend>兴趣</legend><p class="person-label">我方</p><div class="choices" id="preferences-a"></div><p class="person-label">对方</p><div class="choices" id="preferences-b"></div></fieldset>
<fieldset id="theme"><legend>本次倾向</legend><div class="choices"><label class="choice"><input name="theme" type="radio" value="any" checked>顺其自然</label><label class="choice"><input name="theme" type="radio" value="daily">日常陪伴</label><label class="choice"><input name="theme" type="radio" value="romantic">拍照与氛围</label><label class="choice"><input name="theme" type="radio" value="fresh">新体验</label></div></fieldset>
<fieldset id="area"><legend>活动范围</legend><div class="choices"><label class="choice"><input name="area" type="radio" value="all">不限制</label><label class="choice"><input name="area" type="radio" value="near" checked>华农及周边</label><label class="choice"><input name="area" type="radio" value="campus">华农校内</label></div></fieldset>
<fieldset id="city-tier"><legend>城市级别</legend><div class="choices"><label class="choice"><input name="cityTier" type="radio" value="tier1" checked>一线</label><label class="choice"><input name="cityTier" type="radio" value="tier2">二线</label><label class="choice"><input name="cityTier" type="radio" value="tier3">三线及以下</label></div></fieldset>
<fieldset><legend>已准备</legend><div class="choices"><label class="choice"><input name="prepared" type="checkbox" value="picnic_pack">野餐包</label><label class="choice"><input name="prepared" type="checkbox" value="racket">球拍</label><label class="choice"><input name="prepared" type="checkbox" value="ball">球</label><label class="choice"><input name="prepared" type="checkbox" value="reservation">已预约</label></div></fieldset><fieldset id="exclude"><legend>不去</legend><div id="exclude-options" class="choices"><label class="choice"><input name="exclude" type="radio" value="" checked>不排除</label></div></fieldset><fieldset id="anchor"><legend>必去</legend><div id="anchor-options" class="choices"><label class="choice"><input name="anchor" type="radio" value="" checked>不指定</label></div></fieldset><label class="choice robust-choice"><input id="robust" type="checkbox" checked>多留余地</label></details>
<label class="field budget-field">双人预算<input id="budget" type="number" min="0" max="100000" step="0.01"></label>
<button class="apply-button" type="submit">规划</button></form></details></aside>
<main id="main-content">
<section id="view-plan" class="view">
  <section class="exploration" aria-labelledby="exploration-title"><div class="slider-top"><div class="exploration-label"><h2 id="exploration-title">探索度</h2><p class="slider-note">possibility</p></div><output id="exploration-value" for="exploration">0<small>/ 100</small></output></div><input id="exploration" type="range" min="0" max="100" step="1" value="0" aria-label="探索度"></section>
  <span id="status" class="sr-only" role="status" aria-live="polite"></span>
  <div id="stages" aria-busy="true"><section class="skeleton-stage" role="status" aria-label="正在加载"><div class="stage-heading"><span class="skeleton skeleton-time"></span></div><div class="skeleton-cards"><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div></div><div class="skeleton-row"><span class="skeleton skeleton-activity"></span><span class="skeleton skeleton-activity"></span></div></section></div>
  <div id="ending" class="balance-line"></div>
  <details class="explanation"><summary>理由</summary><div id="reason-content"></div></details>
</section>
<section id="view-knowledge" class="view" hidden>
  <button class="back-button" data-home type="button">返回</button>
  <div class="section-heading"><h2>知识与推理</h2></div><div class="knowledge-summary" id="knowledge-summary"></div>
  <section class="insight-panel"><h3>知识图谱</h3><div class="graph-query"><label class="field">起点<select id="graph-from"></select></label><label class="field">终点<select id="graph-to"></select></label><button id="query-graph" class="apply-button">查询</button></div><div id="graph-paths"></div></section>
  <section class="insight-panel"><h3>规则</h3><div id="rule-trace"></div></section><section class="insight-panel"><h3>来源</h3><div id="source-audit"></div></section>
</section>
<section id="view-compare" class="view" hidden>
  <button class="back-button" data-home type="button">返回</button><div class="section-heading"><h2>方案对比</h2></div><div id="comparison"></div><section class="insight-panel"><div id="search-details"></div></section>
</section>
<section id="view-diagnostics" class="view" hidden><button class="back-button" data-home type="button">返回</button><div class="section-heading"><h2>输入输出</h2></div><button id="copy-options" class="apply-button" type="button">复制当前选项</button><p id="replay-id" class="diagnostic-values"></p></section>
<section id="view-about" class="view" hidden><button class="back-button" data-home type="button">返回</button><div id="about-info" class="insight-panel"></div></section>
<noscript><p>请启用 JavaScript。</p></noscript>
</main></div>
<div class="more-menu-area">
  <button id="more-menu-toggle" class="more-menu-toggle" type="button" aria-label="更多" aria-controls="more-menu" aria-expanded="false">三</button>
  <nav id="more-menu" class="more-menu" aria-label="更多" hidden>
    <button type="button" data-view="knowledge">知识与推理</button><button type="button" data-view="compare">方案对比</button><button type="button" id="import">导入JSON</button><button type="button" id="export">导出JSON</button><button type="button" data-view="diagnostics">输入输出</button><button type="button" data-view="about">关于</button>
  </nav>
</div>
<input id="import-file" type="file" accept="application/json,.json" hidden>
</div></body></html>
